<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ee; --surface:#ffffff; --surface-2:#f1ede4; --ink:#17202e; --ink-2:#4b5566; --ink-3:#6f7888;
  --line:#e2dccf; --navy:#16294a; --navy-2:#223a63; --accent:#a8382a; --accent-soft:#f6e3df;
  --chip:#e9eef6; --chip-ink:#20406d; --mark:#ffe58a; --shadow:0 1px 2px rgba(23,32,46,.06),0 6px 20px rgba(23,32,46,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1622; --surface:#162132; --surface-2:#1c2a3f; --ink:#e9edf3; --ink-2:#b4bdcb; --ink-3:#8b95a5;
    --line:#2a3a52; --navy:#0b1220; --navy-2:#16294a; --accent:#e0705f; --accent-soft:#3a2420;
    --chip:#22334d; --chip-ink:#c9d8ee; --mark:#806a12; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:110px}
a{color:inherit}
button{font:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

/* hero */
.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);color:#f3f5f9;padding:44px 0 92px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,#a8382a 0 40px,#f3f5f9 40px 80px);opacity:.85}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600;color:#c7d3e6;margin:0 0 10px}
.hero h1{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:clamp(32px,5.4vw,52px);line-height:1.08;margin:0 0 12px;letter-spacing:-.01em}
.hero p.sub{font-size:18px;color:#d6deea;max-width:640px;margin:0 0 26px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin:0;padding:0;list-style:none}
.stats li{display:flex;flex-direction:column}
.stats b{font-family:"Source Serif 4",Georgia,serif;font-size:26px;line-height:1.1;color:#fff}
.stats span{font-size:13px;color:#b9c6da}

/* search */
.searchbar{position:sticky;top:0;z-index:20;margin-top:-58px;padding:10px 0}
.searchbar.stuck{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--line)}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px}
.sbox svg{flex:none;color:var(--ink-3)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:18px;padding:8px 0}
#q::placeholder{color:var(--ink-3)}
#clear{border:0;background:var(--surface-2);color:var(--ink-2);border-radius:8px;padding:6px 10px;font-size:13px;display:none}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 6px}
.tools .lbl{font-size:13px;color:var(--ink-3);margin-right:2px}
.chip{border:1px solid transparent;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;line-height:1.5}
.chip:hover{border-color:var(--chip-ink)}
.chip.on{background:var(--chip-ink);color:var(--surface)}
#status{font-size:14px;color:var(--ink-2);margin:6px 0 18px;min-height:22px}
.downloads{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}

/* episodes */
.ep{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:0 0 18px;display:grid;grid-template-columns:92px 1fr;overflow:hidden}
.date{background:var(--surface-2);border-right:1px solid var(--line);text-align:center;padding:20px 8px}
.date .m{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600;color:var(--accent)}
.date .d{display:block;font-family:"Source Serif 4",Georgia,serif;font-size:34px;font-weight:700;line-height:1.1}
.date .y{display:block;font-size:12px;color:var(--ink-3)}
.date .wd{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}
.body{padding:20px 22px 18px;min-width:0}
.ep h2{font-family:"Source Serif 4",Georgia,serif;font-size:23px;line-height:1.25;margin:0 0 6px}
.meta{font-size:13px;color:var(--ink-3);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:4px 14px}
.summary{color:var(--ink-2);margin:0 0 12px}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.hosts{font-size:14px;color:var(--ink-2);margin:0 0 14px}
.hosts b{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.play{display:inline-flex;align-items:center;gap:8px;background:var(--navy-2);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600}
.play:hover{filter:brightness(1.15)}
.listen{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 4px}
.play.big{font-size:16px;padding:11px 20px;border-radius:12px}
.listen .hint{font-size:13px;color:var(--ink-3)}
.toggle{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500}
.toggle[aria-expanded=true]{background:var(--surface-2)}
.panel{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.panel[hidden]{display:none}
.mlist,.hits{list-style:none;margin:0;padding:0}
.mlist li,.hits li{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.mlist li:last-child,.hits li:last-child{border-bottom:0}
.tbtn{border:0;background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:2px 8px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;height:fit-content;justify-self:start}
.tbtn:hover{background:var(--accent);color:#fff}
.hitbox{margin:14px 0 0;background:var(--surface-2);border-radius:12px;padding:10px 14px}
.hitbox h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:2px 0 6px}
.transcript{max-height:460px;overflow:auto;padding-right:6px}
.seg{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:6px 6px;border-radius:8px;font-size:15px;color:var(--ink-2)}
.seg.active{background:var(--accent-soft);color:var(--ink)}
.seg:hover{background:var(--surface-2)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.files{font-size:13px;color:var(--ink-3);margin-top:12px}
.files a{color:var(--ink-2)}
.empty{text-align:center;color:var(--ink-2);padding:40px 0}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);color:#eef2f8;box-shadow:0 -6px 24px rgba(0,0,0,.18);transform:translateY(110%);transition:transform .25s ease}
.player.show{transform:none}
.player .wrap{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px}
.np{min-width:0;flex:0 1 320px}
.np small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a9b8cf}
.np div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14px}
.player audio{flex:1;min-width:0;height:40px}
footer{color:var(--ink-3);font-size:13px;text-align:center;padding:26px 0 10px}

@media (max-width:640px){
  .hero{padding:32px 0 84px}
  .ep{grid-template-columns:1fr}
  .date{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline;justify-content:flex-start;padding:10px 18px;text-align:left}
  .date .d{font-size:22px}.date .wd{margin:0}
  .body{padding:16px}
  .ep h2{font-size:20px}
  .mlist li,.hits li,.seg{grid-template-columns:64px 1fr}
  .player .wrap{flex-direction:column;align-items:stretch;gap:6px}
  .np{flex:none}
}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <p class="eyebrow">Searchable podcast archive</p>
    <h1>__TITLE__</h1>
    <p class="sub">__SUBTITLE__</p>
    <ul class="stats">
      <li><b>__COUNT__</b><span>episodes</span></li>
      <li><b>__HOURS__</b><span>of audio</span></li>
      <li><b>__WORDS__</b><span>words transcribed</span></li>
    </ul>
  </div>
</header>

<div class="searchbar" id="sb">
  <div class="wrap">
    <div class="sbox">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Search titles, summaries and full transcripts" aria-label="Search episodes and transcripts">
      <button id="clear" type="button">Clear</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="tools" id="topics"><span class="lbl">Popular topics:</span></div>
  <div id="status" aria-live="polite"></div>
  <section id="list"></section>
  <div class="downloads" id="downloads" hidden>
    <span class="lbl" style="font-size:13px;color:var(--ink-3)">Downloads:</span>
  </div>
  <footer>__FOOTER__</footer>
</main>

<div class="player" id="player" aria-label="Audio player">
  <div class="wrap">
    <div class="np"><small>Now playing</small><div id="npTitle"></div></div>
    <audio id="audio" controls preload="none"></audio>
  </div>
</div>

<script type="application/json" id="data">__DATA__</script>
<script type="application/json" id="downloads-data">__DOWNLOADS__</script>
<script>
(function(){
const EPS = JSON.parse(document.getElementById('data').textContent);
const $ = (s, el=document) => el.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const fmt = t => { t = Math.floor(t); const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0'); };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const audio = $('#audio'), player = $('#player');
let current = -1, query = '';

let SEGS_READY = false;
EPS.forEach(e => { e.segs = []; e.lower = []; e.meta = (e.title+' '+e.summary+' '+e.keywords.join(' ')+' '+e.people+' '+e.moments.map(m=>m[1]).join(' ')).toLowerCase(); });

// topics: most frequent keywords
const freq = {};
EPS.forEach(e => e.keywords.forEach(k => { const key = k.toLowerCase(); freq[key] = freq[key] || {n:0, label:k}; freq[key].n++; }));
const topics = Object.values(freq).sort((a,b) => b.n - a.n || a.label.length - b.label.length).slice(0, 10);
const tbox = $('#topics');
topics.forEach(t => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = t.label; b.onclick = () => setQuery(query.toLowerCase() === t.label.toLowerCase() ? '' : t.label); tbox.appendChild(b); });

function hl(text){ if(!query) return esc(text); const re = new RegExp('('+reEsc(query)+')','ig'); return esc(text).replace(new RegExp('('+reEsc(esc(query))+')','ig'), '<mark>$1</mark>'); }

function card(e, i){
  const d = e.date ? new Date(e.date + 'T12:00:00') : null;
  const el = document.createElement('article'); el.className = 'ep'; el.id = 'ep-' + e.id;
  el.innerHTML = `
  <div class="date">${d ? `<span class="m">${MONTHS[d.getMonth()]}</span><span class="d">${d.getDate()}</span><span class="y">${d.getFullYear()}</span><span class="wd">${DAYS[d.getDay()]}</span>` : '<span class="d">&middot;</span>'}</div>
  <div class="body">
    <h2 data-f="title"></h2>
    <div class="meta"><span>${Math.round(e.minutes)} min</span><span>${e.words.toLocaleString('en-US')} words</span>${e.moments.length ? `<span>${e.moments.length} key moments</span>` : ''}</div>
    <div class="listen" ${e.audio ? '' : 'hidden'}><button class="play big" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>Listen now</button><span class="hint">streams in the page player</span></div>
    <p class="summary" data-f="summary"></p>
    <div class="kws"></div>
    <p class="hosts" ${e.people ? '' : 'hidden'}><b>People:</b> <span data-f="people"></span></p>
    <div class="hitbox" hidden><h3></h3><ul class="hits"></ul></div>
    <div class="actions" style="margin-top:14px">
      <button class="toggle" type="button" data-p="moments" aria-expanded="false" ${e.moments.length ? '' : 'hidden'}>Key moments</button>
      <button class="toggle" type="button" data-p="transcript" aria-expanded="false">Full transcript</button>
    </div>
    <div class="panel" data-panel="moments" hidden><ul class="mlist"></ul></div>
    <div class="panel" data-panel="transcript" hidden><div class="transcript"></div></div>
    <div class="files">Files: ${e.audio ? `<a href="${esc(e.audio)}" download>Audio</a> &middot; ` : ''}<a href="transcripts/${esc(e.id)}.txt" target="_blank" rel="noopener">Transcript (TXT)</a> &middot; <a href="transcripts/${esc(e.id)}.srt" download>Subtitles (SRT)</a> &middot; <a href="transcripts/${esc(e.id)}.vtt" download>WebVTT</a> &middot; <a href="transcripts/${esc(e.id)}.json" download>Word timings (JSON)</a></div>
  </div>`;
  const kws = $('.kws', el);
  e.keywords.forEach(k => { const b = document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=k; b.onclick=()=>setQuery(k); kws.appendChild(b); });
  $('.mlist', el).innerHTML = e.moments.map(m => `<li><button class="tbtn" type="button" data-t="${m[0]}">${fmt(m[0])}</button><span>${esc(m[1])}</span></li>`).join('');
  $('.play', el).onclick = () => play(i, 0, true);
  el.querySelectorAll('.toggle').forEach(b => b.onclick = () => {
    const p = $(`[data-panel="${b.dataset.p}"]`, el), open = p.hidden;
    p.hidden = !open; b.setAttribute('aria-expanded', open);
    if (open && b.dataset.p === 'transcript') renderTranscript(i, el);
  });
  el.addEventListener('click', ev => { const t = ev.target.closest('[data-t]'); if (t) play(i, +t.dataset.t); });
  e.el = el;
  return el;
}

function renderTranscript(i, el){
  const e = EPS[i], box = $('.transcript', el);
  if (!SEGS_READY){ box.innerHTML = '<div class="seg">Loading transcript…</div>'; const wait = setInterval(() => { if (SEGS_READY){ clearInterval(wait); renderTranscript(i, el); } }, 400); return; }
  box.innerHTML = e.segs.map((s, k) => `<div class="seg" data-k="${k}"><button class="tbtn" type="button" data-t="${s[0]}">${fmt(s[0])}</button><span>${hl(s[1])}</span></div>`).join('');
  box.dataset.q = query;
  const firstHit = box.querySelector('mark');
  if (firstHit) box.scrollTop = firstHit.closest('.seg').offsetTop - box.offsetTop - 8;
}

function play(i, t, fromStart){
  const e = EPS[i];
  if (!e.audio) return;
  if (current !== i){ audio.src = e.audio; current = i; $('#npTitle').textContent = e.title + ' (' + e.date + ')'; }
  player.classList.add('show');
  const go = () => { if (!fromStart || audio.currentTime === 0 || t) audio.currentTime = t; audio.play(); };
  if (audio.readyState >= 1) go(); else { audio.addEventListener('loadedmetadata', go, {once:true}); audio.load(); }
}

audio.addEventListener('timeupdate', () => {
  if (current < 0) return; const e = EPS[current], box = e.el && $('.transcript', e.el);
  if (!box || !box.children.length || box.closest('.panel').hidden) return;
  let k = 0; const t = audio.currentTime; while (k + 1 < e.segs.length && e.segs[k+1][0] <= t) k++;
  const prev = box.querySelector('.seg.active'); const now = box.children[k];
  if (prev !== now){ prev && prev.classList.remove('active'); now.classList.add('active');
    const top = now.offsetTop - box.offsetTop; if (top < box.scrollTop || top > box.scrollTop + box.clientHeight - 60) box.scrollTop = top - 40; }
});

const dl = $('#downloads');
JSON.parse(document.getElementById('downloads-data').textContent).forEach(([href, label], k) => {
  const a = document.createElement('a'); a.className = 'btn' + (k ? '' : ' primary'); a.href = href; a.download = ''; a.textContent = label;
  dl.appendChild(a); dl.hidden = false; });
const list = $('#list');
EPS.forEach((e, i) => list.appendChild(card(e, i)));
fetch('segments.json').then(r => r.json()).then(all => {
  EPS.forEach(e => { e.segs = all[e.id] || []; e.lower = e.segs.map(s => s[1].toLowerCase()); });
  SEGS_READY = true; apply();
}).catch(() => { SEGS_READY = true; $('#status').textContent = 'Full transcripts could not be loaded; searching titles, summaries and keywords only.'; });

function apply(){
  const q = query.toLowerCase(); let shown = 0, total = 0;
  document.querySelectorAll('#topics .chip').forEach(c => c.classList.toggle('on', c.textContent.toLowerCase() === q && !!q));
  EPS.forEach((e, i) => {
    const el = e.el; ['title','summary','people'].forEach(f => $(`[data-f="${f}"]`, el).innerHTML = hl(e[f]));
    $('.kws', el).querySelectorAll('.chip').forEach(c => c.classList.toggle('on', !!q && c.textContent.toLowerCase().includes(q)));
    const hb = $('.hitbox', el);
    if (!q){ el.hidden = false; hb.hidden = true; shown++; }
    else {
      const hits = []; e.lower.forEach((s, k) => { if (s.includes(q)) hits.push(k); });
      const inMeta = e.meta.includes(q);
      el.hidden = !(hits.length || inMeta);
      if (!el.hidden) shown++;
      total += hits.length;
      if (hits.length){
        hb.hidden = false;
        $('h3', hb).textContent = hits.length + (hits.length === 1 ? ' mention' : ' mentions') + ' in the transcript' + (hits.length > 4 ? ' (first 4 shown)' : '');
        $('.hits', hb).innerHTML = hits.slice(0, 4).map(k => { const s = e.segs[k][1], lo = e.lower[k], p = lo.indexOf(q);
          let a = Math.max(0, p - 110), b = Math.min(s.length, p + q.length + 140);
          if (a > 0){ const sp = s.indexOf(' ', a); a = (sp > -1 && sp < p) ? sp + 1 : a; }
          if (b < s.length){ const sp = s.lastIndexOf(' ', b); b = sp > p + q.length ? sp : b; }
          const snip = (a ? '… ' : '') + s.slice(a, b) + (b < s.length ? ' …' : '');
          return `<li><button class="tbtn" type="button" data-t="${e.segs[k][0]}">${fmt(e.segs[k][0])}</button><span>${hl(snip)}</span></li>`; }).join('');
      } else hb.hidden = true;
    }
    const tb = $('.transcript', el); if (tb.children.length && tb.dataset.q !== query && !tb.closest('.panel').hidden) renderTranscript(i, el); else if (tb.dataset.q !== query) tb.innerHTML = '';
  });
  const st = $('#status');
  if (!q) st.textContent = EPS.length + (EPS.length === 1 ? ' episode' : ' episodes, newest first') + '. Click a timestamp to play from that moment.' + (SEGS_READY ? '' : ' Loading full transcripts for search…');
  else if (!shown) st.innerHTML = 'No episode mentions <b>' + esc(query) + '</b>.';
  else st.innerHTML = '<b>' + esc(query) + '</b>: found in ' + shown + ' of ' + EPS.length + ' episodes' + (total ? ', ' + total + ' transcript ' + (total === 1 ? 'mention' : 'mentions') : '') + '. Click a timestamp to hear it.';
  $('#clear').style.display = q ? 'inline-block' : 'none';
}

let timer; const qi = $('#q');
function setQuery(v){ qi.value = v; query = v.trim(); apply(); if (v){ const y = $('#topics').getBoundingClientRect().top + window.scrollY - 90; if (window.scrollY > y) window.scrollTo({top:y, behavior:'smooth'}); } }
qi.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { query = qi.value.trim(); apply(); }, 180); });
$('#clear').onclick = () => { setQuery(''); qi.focus(); };
const sb = $('#sb'); new IntersectionObserver(([en]) => sb.classList.toggle('stuck', en.intersectionRatio < 1), {threshold:[1], rootMargin:'-1px 0px 0px 0px'}).observe(sb);
apply();
})();
</script>
</body>
</html>
