[project]
name = "transcription-pipeline"
version = "1.0.0"
description = "Resumable, parallel podcast/audio archive transcription with Whisper (faster-whisper or Groq API)"
requires-python = ">=3.10"
dependencies = ["numpy", "requests", "pyyaml"]

[project.optional-dependencies]
local = ["faster-whisper>=1.1"]
xlsx = ["openpyxl"]
dev = ["pytest"]

[tool.setuptools]
packages = ["transcription_pipeline"]

[tool.setuptools.package-data]
transcription_pipeline = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
